<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">PWE PC MONITOR floating widget preview</title>
  <desc id="desc">Illustrative compact bar with icon-only labels and an expanded hover panel with readable metric names. Unavailable sensors are omitted.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091323" />
      <stop offset="1" stop-color="#182942" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#030811" flood-opacity=".35" />
    </filter>
    <g id="wing">
      <path d="M12 258 C168 224 318 151 489 5 C358 157 236 225 121 272 C283 234 419 194 582 108 C437 221 270 275 130 300 C282 285 420 270 626 220 C447 307 265 324 132 325 C266 333 386 356 540 399 C337 380 170 360 34 330 L12 258 Z" fill="#F5B335" />
    </g>
    <g id="cpu" fill="none" stroke="#BCC7D5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 7h10v10H7zM10 10h4v4h-4zM4 9h3M4 12h3M4 15h3M17 9h3M17 12h3M17 15h3M9 4v3M12 4v3M15 4v3M9 17v3M12 17v3M15 17v3" />
    </g>
    <g id="memory" fill="none" stroke="#BCC7D5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 6h14v12H5zM8 9h8v2H8zM8 13h8v2H8zM8 4v2M12 4v2M16 4v2M8 18v2M12 18v2M16 18v2" />
    </g>
    <g id="gpu" fill="none" stroke="#BCC7D5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16l-3 10H7zM8 11h8M9 14h6" />
    </g>
    <g id="storage" fill="none" stroke="#BCC7D5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM7 8h10M7 12h10M7 16h5" />
    </g>
    <g id="power" fill="none" stroke="#BCC7D5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v8M8 5.2a8 8 0 1 0 8 0" />
    </g>
    <g id="battery" fill="none" stroke="#BCC7D5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16v10H4zM20 10h2v4h-2M8 10v4h8v-4" />
    </g>
    <g id="sparkle" fill="#F5B335">
      <path d="M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z" />
    </g>
    <style>
      .eyebrow { font-family: Inter, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 1.7px; fill: #BCC7D5; }
      .title { font-family: Inter, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #F7F5F2; }
      .label { font-family: Inter, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #BCC7D5; }
      .value { font-family: Inter, "Segoe UI", sans-serif; font-size: 26px; font-weight: 600; fill: #F7F5F2; }
      .muted { font-family: Inter, "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; fill: #BCC7D5; }
    </style>
  </defs>

  <rect width="1280" height="700" fill="url(#background)" />
  <text x="74" y="76" class="eyebrow">PWE PC MONITOR · FLOATING WIDGET</text>
  <text x="74" y="119" class="title">A small glance. More detail on hover.</text>
  <text x="1204" y="77" text-anchor="end" class="muted">STATIC VECTOR PREVIEW</text>

  <text x="74" y="183" class="eyebrow">COMPACT</text>
  <rect x="74" y="204" width="528" height="116" rx="36" fill="#152239" fill-opacity=".94" stroke="#35445E" stroke-width="2" filter="url(#shadow)" />
  <rect x="94" y="234" width="56" height="56" rx="18" fill="#F5B335" fill-opacity=".16" />
  <use href="#wing" transform="translate(100 246) scale(.07)" />
  <use href="#cpu" transform="translate(170 249) scale(1.05)" />
  <text x="199" y="271" class="value">7%</text>
  <use href="#memory" transform="translate(284 249) scale(1.05)" />
  <text x="313" y="271" class="value">73%</text>
  <use href="#gpu" transform="translate(410 249) scale(1.05)" />
  <text x="439" y="271" class="value">1%</text>
  <use href="#sparkle" transform="translate(549 245) scale(1.15)" />

  <path d="M602 262h54" stroke="#F5B335" stroke-width="2" stroke-dasharray="5 6" opacity=".7" />
  <text x="629" y="246" text-anchor="middle" class="muted">hover</text>
  <text x="74" y="366" class="muted">The wing, live values, and one memory shortcut stay in view.</text>
  <text x="74" y="393" class="muted">CPU · memory · GPU shown here; available channels vary by PC.</text>

  <text x="680" y="140" class="eyebrow">HOVER DETAIL</text>
  <rect x="680" y="160" width="522" height="414" rx="27" fill="#152239" fill-opacity=".94" stroke="#35445E" stroke-width="2" filter="url(#shadow)" />
  <text x="706" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#F7F5F2">PWE-VAIO-Z · 8 GB · up 10d 8h</text>
  <text x="706" y="225" class="muted">Intel Core i7-6567U</text>
  <text x="1172" y="206" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" fill="#BCC7D5">×</text>

  <use href="#cpu" transform="translate(707 264) scale(.75)" />
  <text x="731" y="280" class="label">CPU</text>
  <text x="882" y="280" text-anchor="end" class="value">7%</text>
  <text x="707" y="303" class="muted">2.31 GHz · 63°</text>

  <use href="#gpu" transform="translate(950 264) scale(.75)" />
  <text x="974" y="280" class="label">GPU</text>
  <text x="1168" y="280" text-anchor="end" class="value">1%</text>
  <text x="950" y="303" class="muted">420 MHz · 63°</text>

  <use href="#memory" transform="translate(707 346) scale(.75)" />
  <text x="731" y="362" class="label">MEMORY</text>
  <text x="882" y="362" text-anchor="end" class="value">73%</text>
  <text x="707" y="385" class="muted">1.4 GB available</text>

  <use href="#storage" transform="translate(950 346) scale(.75)" />
  <text x="974" y="362" class="label">SSD</text>
  <text x="1168" y="362" text-anchor="end" class="value">191 GB</text>
  <text x="950" y="385" class="muted">of 255 GB</text>

  <use href="#power" transform="translate(707 428) scale(.75)" />
  <text x="731" y="444" class="label">POWER</text>
  <text x="882" y="444" text-anchor="end" class="value">1.7 W</text>
  <text x="707" y="467" class="muted">CPU 1.7 W</text>

  <use href="#battery" transform="translate(950 428) scale(.75)" />
  <text x="974" y="444" class="label">BATTERY</text>
  <text x="1168" y="444" text-anchor="end" class="value">100%</text>
  <text x="950" y="467" class="muted">on power</text>

  <line x1="706" y1="510" x2="1176" y2="510" stroke="#35445E" stroke-width="1.5" />
  <use href="#sparkle" transform="translate(707 532) scale(.72)" />
  <text x="733" y="550" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#F5B335">Optimize memory</text>
  <text x="680" y="616" class="muted">Only readable channels appear; unavailable ones remain in Settings.</text>
  <text x="74" y="653" class="muted">Illustrative values only · the Windows app reads live hardware and driver telemetry.</text>
</svg>
