name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      # These major versions use the Node.js 24 action runtime. The older v4
      # versions were being transparently forced from Node 20 to Node 24.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PwePcMonitor.slnx --runtime win-x64

      - name: Build
        run: dotnet build PwePcMonitor.slnx --configuration Release --no-restore

      - name: Publish and package self-contained Windows build
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Runtime win-x64 -PackageVersion "${{ github.ref_name }}"

      - name: Smoke test the published EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/win-x64/PwePcMonitor.exe"
          $cases = @(
            @{ Arguments = @("--smoke-test", "--safe-mode"); Name = "safe" },
            @{ Arguments = @("--smoke-test"); Name = "enhanced" }
          )
          foreach ($case in $cases) {
            $process = Start-Process -FilePath $exe -ArgumentList $case.Arguments -PassThru
            try {
              # windows-latest is a service session without a desktop shell;
              # it may not dispatch WPF timers. Staying alive is the useful
              # assertion here, so only a non-zero early exit fails the build.
              Start-Sleep -Seconds 5
              $process.Refresh()
              if ($process.HasExited -and $process.ExitCode -ne 0) {
                throw "PwePcMonitor.exe exited with code $($process.ExitCode) ($($case.Name))."
              }
            }
            finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                $process.WaitForExit(5000)
              }
              $log = Join-Path $env:LOCALAPPDATA "PWE/PC Monitor/logs/latest.log"
              if (Test-Path -LiteralPath $log) {
                Copy-Item -LiteralPath $log -Destination (Join-Path $PWD "artifacts/smoke-$($case.Name).log") -Force
              }
            }
          }

      - name: Upload runnable artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pwe-pc-monitor-win-x64
          path: |
            artifacts/pwe-pc-monitor-win-x64-*.zip
            artifacts/pwe-pc-monitor-win-x64-*.sha256
            artifacts/smoke-*.log
          if-no-files-found: warn
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v7
        with:
          name: pwe-pc-monitor-win-x64
          path: release-assets

      - name: Publish public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -LiteralPath release-assets -Filter "*.zip" | Select-Object -First 1
          $checksum = Get-ChildItem -LiteralPath release-assets -Filter "*.sha256" | Select-Object -First 1
          if ($null -eq $zip -or $null -eq $checksum) {
            throw "The packaged zip and SHA-256 file were not downloaded."
          }
          $notes = Join-Path $PWD "release-notes.md"
          @"
          PWE PC MONITOR $env:GITHUB_REF_NAME

          Self-contained Windows x64 build. Extract the zip and run PwePcMonitor.exe.
          No separate .NET installation is required. This release is read-only and does not contain fan control.
          GPU temperature sources use the installed NVIDIA NVAPI, AMD ADL or Intel IGCL driver backend through LibreHardwareMonitor; no vendor DLLs are bundled.
          PawnIO is optional and is not bundled; the app provides an explicit official installer link and sensor recheck action when a machine needs it.

          Verify the download with the accompanying SHA-256 file.
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $zip.FullName $checksum.FullName --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME $zip.FullName $checksum.FullName --repo $env:GITHUB_REPOSITORY --verify-tag --title "PWE PC MONITOR $env:GITHUB_REF_NAME" --notes-file $notes
          }
